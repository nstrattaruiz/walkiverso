<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Walkiverso · Arte, Magia y Folklore</title>
  <meta name="description" content="Criaturas y artefactos de fantasía oscura, nacidos del folklore, la mitología y la ficción.">
  <meta name="theme-color" content="#071A3D">
  <script>
    // Carpeta base de la web: la raíz en la plataforma; /<repositorio>/ en GitHub Pages. Todo lo demás (css, js, img) cuelga de acá.
    (function () {
      var base = /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
      document.write('<base href="' + base + '">');
      try {
        // GitHub Pages no conoce las rutas de la web (/tienda, /producto/…): 404.html guarda la pedida y vuelve acá
        var ruta = sessionStorage.getItem('wk-ruta');
        if (ruta) { sessionStorage.removeItem('wk-ruta'); history.replaceState(null, '', ruta); }
        // La animación de carga se muestra una vez por visita
        if (sessionStorage.getItem('wk-visto')) document.documentElement.classList.add('wk-sin-carga');
      } catch (e) { /* sin almacenamiento */ }
    })();
  </script>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" id="favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Fraunces:ital,opsz,wght@1,9..144,300..500&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/ns-firma.css">
  <link rel="stylesheet" href="css/wk-base.css">
  <link rel="stylesheet" href="css/wk-inicio.css">
  <link rel="stylesheet" href="css/wk-tienda.css">
  <link rel="stylesheet" href="css/wk-paginas.css">
  <link rel="stylesheet" href="css/wk-forma.css">
</head>
<body class="wk-blanco">
  <!-- ============ Carga inicial: las raíces crecen, aparece el nombre y se abren como un telón ============ -->
  <div class="wk-carga" id="carga" aria-hidden="true">
    <span class="wk-carga__rama wk-carga__rama--izq wk-carga__rama--fondo"></span>
    <span class="wk-carga__rama wk-carga__rama--der wk-carga__rama--fondo"></span>
    <span class="wk-carga__rama wk-carga__rama--izq"></span>
    <span class="wk-carga__rama wk-carga__rama--der"></span>
    <div class="wk-carga__centro">
      <img src="img/logo-walkiverso.svg" alt="" width="420" height="112">
      <p>Arte, Magia y Folklore</p>
      <span class="wk-carga__barra"><i></i></span>
    </div>
  </div>
  <!-- Walkiverso · web para la plataforma (Kit NS). Los datos salen de la tienda con el SDK: ver js/app.js y LEEME.md -->

  <!-- Iconos reutilizables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-wa" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-3.8A8 8 0 1 1 8 19.1z"/><path d="M9.2 8.6c.2-.4.5-.4.8-.4h.4l.9 2-.6.9c.5 1 1.3 1.8 2.3 2.3l.9-.6 2 .9v.4c0 .3 0 .6-.4.8-.9.6-2.3.4-4-.8a9 9 0 0 1-2.8-3.1c-.7-1.4-.1-2.1.5-2.4z"/></g></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M5 3h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 7.3 7.3l1.4-2.2L21 15.5V19a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></g></symbol>
    <symbol id="i-fb" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M14 8.5h2.5V5H14a3.5 3.5 0 0 0-3.5 3.5V11H8v3.5h2.5V21H14v-6.5h2.5L17 11h-3V9a.5.5 0 0 1 .5-.5z"/></symbol>
    <symbol id="i-tt" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5M14 4c.3 2.4 2 4 4.5 4.3"/></symbol>
    <symbol id="i-yt" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></g></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.6-3.600 3.400-5.500 7-5.500s6.400 1.900 7 5.500"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M12 20s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 7.300 4.300 4.300 0 0 1 19.500 10c0 5.400-7.500 10-7.500 10z"/></symbol>
    <symbol id="i-lupa" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-ojo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.5C8 7 6.5 9.6 6.5 12S8 17 12 20.5c4-3.5 5.5-6.100 5.500-8.500S16 7 12 3.500z"/><circle cx="12" cy="12" r="2.200" fill="currentColor" stroke="none"/></g></symbol>
    <symbol id="i-sello" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9.500" r="5.500"/><path d="m8.500 14-1.500 6.500 5-2.500 5 2.500L15.500 14"/><path d="m10 9.500 1.500 1.500 2.500-3"/></g></symbol>
    <symbol id="i-filtro" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M4 7h16M7 12h10M10 17h4"/></symbol>
  </svg>

  <div class="aviso" id="aviso" hidden></div>

  <!-- ============ Firma NS: header píldora + ☰ en círculo + menú grande ============ -->
  <header class="ns-header" id="ns-header">
    <button class="ns-menu-btn" type="button" aria-expanded="false" aria-controls="ns-panel" aria-label="Abrir menú">
      <span class="ns-menu-btn__lines" aria-hidden="true"><span></span><span></span></span>
    </button>
    <div class="ns-bar">
      <a class="ns-brand" href="/" data-link aria-label="Walkiverso: ir al inicio" id="marca">
        <img src="img/logo-walkiverso.svg" alt="Walkiverso" width="150" height="40">
      </a>
      <nav class="ns-nav" aria-label="Principal" id="nav"></nav>
      <div class="wk-barra-acciones">
      <button class="wk-icono-btn" type="button" id="abrir-buscador" aria-label="Buscar criaturas y artefactos">
        <svg aria-hidden="true"><use href="#i-lupa"/></svg>
      </button>
      <a class="wk-icono-btn wk-barra-fav" href="/favoritos" data-link aria-label="Tus favoritos">
        <svg aria-hidden="true"><use href="#i-heart"/></svg><b class="wk-contador" id="favoritos-cuenta" data-vacio>0</b>
      </a>
      <a class="wk-barra-enlace" href="/cuenta" data-link id="cuenta-enlace" hidden></a>
      <button class="ns-cta" type="button" id="abrir-carrito" aria-label="Abrir el carrito">
        <svg aria-hidden="true"><use href="#i-bag"/></svg>
        <span>Carrito</span><b class="wk-contador" id="contador" data-vacio>0</b>
      </button>
      </div>
    </div>
    <div class="ns-panel" id="ns-panel" aria-hidden="true">
      <nav class="ns-panel__nav" aria-label="Menú" id="panel-nav"></nav>
      <div class="ns-panel__info" id="hablemos"><p class="ns-panel__label">Hablemos</p></div>
    </div>
  </header>
  <div class="ns-scrim" aria-hidden="true"></div>

  <main id="app" tabindex="-1"></main>

  <footer class="wk-pie wk-noche" id="pie"></footer>

  <!-- ============ Buscador global ============ -->
  <div class="wk-buscador" id="buscador" role="dialog" aria-modal="true" aria-label="Buscador" hidden></div>

  <!-- ============ Firma NS: carrito deslizable con fondo desenfocado ============ -->
  <div class="wk-velo" id="carrito-velo" hidden></div>
  <aside class="wk-carrito" id="carrito" aria-label="Tu colección" aria-hidden="true" inert>
    <div class="wk-carrito__cab">
      <h2>Tu colección</h2>
      <button type="button" class="wk-cerrar" id="cerrar-carrito" aria-label="Cerrar"><svg aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="wk-carrito__lineas" id="carrito-lineas"></div>
    <div class="wk-carrito__pie" id="carrito-pie"></div>
  </aside>

  <!-- ============ Modal (certificado de autenticidad, etc.) ============ -->
  <div class="wk-modal" id="modal" role="dialog" aria-modal="true" hidden></div>

  <div class="wk-cookies" id="cookies" hidden></div>

  <!-- ============ Firma NS: volver arriba con anillo de progreso ============ -->
  <div class="ns-top" id="ns-top">
    <button type="button" class="ns-top__button" aria-label="Volver arriba">
      <svg class="ns-top__ring" viewBox="0 0 56 56" aria-hidden="true" focusable="false">
        <circle class="ns-top__track" cx="28" cy="28" r="25"/>
        <circle class="ns-top__progress" cx="28" cy="28" r="25" pathLength="1"/>
      </svg>
      <svg class="ns-top__arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <noscript><p style="padding:140px 24px;text-align:center">Walkiverso necesita JavaScript para mostrar la tienda.</p></noscript>

  <script src="js/ns-firma.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
